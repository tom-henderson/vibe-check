name: deploy

# Continuous delivery for Current Mood.
#
#  * frontend  — always runs; publishes the static site to GitHub Pages. Injects
#                the backend URL from the BACKEND_URL repo variable at build time.
#                While that variable is empty the site ships in "mock mode".
#  * backend   — runs only once AWS is wired up (the AWS_ACCOUNT_ID secret exists).
#                Assumes an IAM role via OIDC and runs `sam build && sam deploy`.
#
# Setup required before the backend job does anything (see docs/DEPLOYMENT.md).
# Each may live under the Secrets or the Variables tab — the workflow reads both:
#   AWS_ACCOUNT_ID              12-digit account id (as a secret, gates the backend job)
#   AWS_SAM_DEPLOY_ROLE_NAME    name of the IAM role the workflow assumes via OIDC
#   AWS_SAM_DEPLOY_BUCKET_NAME  pre-created S3 bucket for SAM upload artifacts
#   AWS_REGION                  optional, default ap-southeast-2
#   BACKEND_URL                 set to the Function URL after the first deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal default for every job; jobs opt into more below (least privilege).
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide whether the backend can deploy yet (AWS_ACCOUNT_ID secret present).
  config:
    runs-on: ubuntu-latest
    outputs:
      deploy_backend: ${{ steps.c.outputs.deploy_backend }}
    steps:
      - id: c
        run: echo "deploy_backend=${{ secrets.AWS_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

  backend:
    needs: config
    # Deploy only from main; the OIDC trust also only allows main, this is
    # defence in depth so a non-main dispatch doesn't even try.
    if: github.ref == 'refs/heads/main' && needs.config.outputs.deploy_backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      STACK_NAME: current-mood
      # Role name and artifact bucket are provided by Tom. They may live under
      # either the Variables or Secrets tab; concatenation yields whichever is
      # set (the other side is an empty string).
      DEPLOY_ROLE_NAME: ${{ vars.AWS_SAM_DEPLOY_ROLE_NAME }}${{ secrets.AWS_SAM_DEPLOY_ROLE_NAME }}
      DEPLOY_BUCKET: ${{ vars.AWS_SAM_DEPLOY_BUCKET_NAME }}${{ secrets.AWS_SAM_DEPLOY_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: sam build
        working-directory: backend
        run: sam build

      - name: sam deploy
        working-directory: backend
        run: >-
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
          --region "$AWS_REGION" --s3-bucket "$DEPLOY_BUCKET"

      - name: Report Function URL
        working-directory: backend
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" \
            --output text)
          {
            echo "### ✅ Backend deployed"
            echo ""
            echo "**Function URL:** \`$URL\`"
            echo ""
            echo "Set the repo **variable** \`BACKEND_URL\` to this value to wire the live frontend (until then it runs in mock mode)."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    # Publish only from main so a workflow_dispatch on another branch can't push
    # unreviewed content to the live Pages site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish to Pages
      id-token: write # Pages deployment attestation
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inject backend URL (empty = mock mode)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "Injecting BACKEND_URL — live mode"
          else
            echo "BACKEND_URL not set — shipping in mock mode"
          fi
          # Replace the placeholder token; an empty value leaves the app in mock mode.
          sed -i "s|__BACKEND_URL__|${BACKEND_URL}|g" frontend/js/config.js

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
