<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>current mood</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,600;0,800;1,500&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --ink:#241f30;
    --paper:#fef6e4;
    --accent:#ff5c8a;
    --dim:#8a7f96;
    --m1:#ff8fb1; --m2:#ffca70; --m3:#8ee39a; --m4:#7ec8ff; --m5:#c69bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Shantell Sans',cursive,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 18px 70px;
  }
  body::before{
    content:"";position:fixed;inset:-40px;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(circle, #ff8fb1 3px, transparent 4px),
      radial-gradient(circle, #7ec8ff 3px, transparent 4px),
      radial-gradient(circle, #ffca70 3px, transparent 4px);
    background-size:180px 180px, 220px 220px, 260px 260px;
    background-position:20px 40px, 120px 160px, 200px 80px;
    opacity:.35;
    animation:drift 60s linear infinite alternate;
  }
  @keyframes drift{
    from{background-position:20px 40px, 120px 160px, 200px 80px;}
    to{background-position:120px -60px, 20px 40px, 90px 220px;}
  }
  @media (prefers-reduced-motion:reduce){
    body::before{animation:none}
  }

  .toolbar{
    display:flex;gap:5px;background:#fff;border:2.5px solid var(--ink);
    border-radius:40px;padding:5px;margin-bottom:38px;
    box-shadow:4px 4px 0 var(--ink);
  }
  .toolbar button{
    font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
    border:0;background:transparent;color:var(--dim);
    padding:8px 15px;border-radius:30px;cursor:pointer;transition:.15s;
  }
  .toolbar button.on{background:var(--accent);color:#fff}

  .stage{width:100%;max-width:600px}
  .screen{display:none}
  .screen.show{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{opacity:0;transform:scale(.94) rotate(-1deg)}to{opacity:1;transform:none}}

  .kicker{
    font-family:'Space Mono',monospace;font-size:13px;font-weight:700;
    text-transform:lowercase;letter-spacing:.05em;color:var(--dim);
    text-align:center;margin-bottom:4px;
  }
  h1{
    font-weight:800;line-height:.95;text-align:center;
    font-size:clamp(40px,11vw,68px);letter-spacing:-.01em;
    transform:rotate(-2deg);margin-bottom:30px;
  }
  h1 .wave{display:inline-block;color:var(--accent);transform:rotate(4deg)}

  .moods{
    display:grid;grid-template-columns:repeat(5,1fr);gap:11px;
  }
  .mood{border:0;background:transparent;padding:0;cursor:pointer}
  .swatch{
    aspect-ratio:1/1;border-radius:20px;
    border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:32px;
    box-shadow:4px 5px 0 var(--ink);
    transition:transform .22s cubic-bezier(.2,1.7,.4,1), box-shadow .22s ease;
    will-change:transform;
  }
  .mood:nth-child(1) .swatch{background:var(--m1);transform:rotate(-4deg)}
  .mood:nth-child(2) .swatch{background:var(--m2);transform:rotate(3deg)}
  .mood:nth-child(3) .swatch{background:var(--m3);transform:rotate(-2deg)}
  .mood:nth-child(4) .swatch{background:var(--m4);transform:rotate(4deg)}
  .mood:nth-child(5) .swatch{background:var(--m5);transform:rotate(-3deg)}
  .mood:hover .swatch{transform:rotate(-6deg) scale(1.12) translateY(-10px);box-shadow:7px 10px 0 var(--ink)}
  .mood:nth-child(even):hover .swatch{transform:rotate(6deg) scale(1.12) translateY(-10px)}
  .mood:active .swatch{transform:scale(1.02) translateY(-2px)}
  .mood:focus-visible .swatch{outline:3px dashed var(--accent);outline-offset:4px}

  .verdict{text-align:center}
  .winner-wrap{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  .winner{
    width:min(280px,62vw);aspect-ratio:1/1;border-radius:28px;
    border:4px solid var(--ink);box-shadow:7px 8px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:92px;
    transform:rotate(-2deg);
  }
  .winner.tie{width:min(190px,42vw);font-size:62px}
  .winner.tie:last-child{transform:rotate(3deg)}
  .w3{background:var(--m3)} .w4{background:var(--m4)}
  .yours{
    display:inline-block;margin-top:24px;
    font-family:'Space Mono',monospace;font-size:12px;color:var(--dim);
    transform:rotate(-1deg);
  }
  .yours .dot{display:inline-block;width:12px;height:12px;border-radius:4px;
    border:2px solid var(--ink);vertical-align:-1px;margin-right:4px}

  .tally{margin-top:44px}
  .tally h3{
    font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
    text-transform:lowercase;color:var(--dim);text-align:center;margin-bottom:22px;
  }
  .row{display:flex;align-items:center;gap:14px;margin-bottom:15px}
  .rank{
    font-family:'Space Mono',monospace;font-weight:700;font-size:18px;
    color:var(--ink);width:26px;text-align:center;
  }
  .chip{width:36px;height:36px;border-radius:10px;border:3px solid var(--ink);flex:none}
  .bar-track{flex:1;height:16px}
  .bar{height:100%;border-radius:999px;border:2.5px solid var(--ink)}
  .num{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;width:34px;text-align:right}

  .foot{
    text-align:center;margin-top:38px;
    font-family:'Space Mono',monospace;font-size:12px;color:var(--dim);
    transform:rotate(-1deg);
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="t-sel" class="on" onclick="show('sel')">pick</button>
  <button id="t-res" onclick="show('res')">result</button>
  <button id="t-tie" onclick="show('tie')">tie</button>
</div>

<div class="stage">

  <section id="sel" class="screen show">
    <h1>what's the <span class="wave">mood</span>?</h1>
    <div class="moods">
      <button class="mood"><div class="swatch">🫠</div></button>
      <button class="mood"><div class="swatch">🦆</div></button>
      <button class="mood"><div class="swatch">🌀</div></button>
      <button class="mood"><div class="swatch">🥔</div></button>
      <button class="mood"><div class="swatch">🛸</div></button>
    </div>
  </section>

  <section id="res" class="screen">
    <div class="verdict">
      <div class="kicker">current mood:</div>
      <div class="winner-wrap">
        <div class="winner w3">🌀</div>
      </div>
      <div class="yours"><span class="dot" style="background:var(--m3)"></span>that's what you picked too</div>
    </div>
    <div class="tally">
      <div class="row"><span class="rank">1</span><div class="chip" style="background:var(--m3)"></div><div class="bar-track"><div class="bar" style="width:100%;background:var(--m3)"></div></div><span class="num">41</span></div>
      <div class="row"><span class="rank">2</span><div class="chip" style="background:var(--m4)"></div><div class="bar-track"><div class="bar" style="width:73%;background:var(--m4)"></div></div><span class="num">30</span></div>
      <div class="row"><span class="rank">3</span><div class="chip" style="background:var(--m5)"></div><div class="bar-track"><div class="bar" style="width:54%;background:var(--m5)"></div></div><span class="num">22</span></div>
      <div class="row"><span class="rank">4</span><div class="chip" style="background:var(--m2)"></div><div class="bar-track"><div class="bar" style="width:37%;background:var(--m2)"></div></div><span class="num">15</span></div>
      <div class="row"><span class="rank">5</span><div class="chip" style="background:var(--m1)"></div><div class="bar-track"><div class="bar" style="width:24%;background:var(--m1)"></div></div><span class="num">10</span></div>
    </div>
    <p class="foot">118 votes today · wipes at midnight</p>
  </section>

  <section id="tie" class="screen">
    <div class="verdict">
      <div class="kicker">current mood:</div>
      <div class="winner-wrap">
        <div class="winner tie w3">🌀</div>
        <div class="winner tie w4">🥔</div>
      </div>
      <div class="yours"><span class="dot" style="background:var(--m4)"></span>you picked the potato one</div>
    </div>
    <div class="tally">
      <div class="row"><span class="rank">1</span><div class="chip" style="background:var(--m3)"></div><div class="bar-track"><div class="bar" style="width:100%;background:var(--m3)"></div></div><span class="num">34</span></div>
      <div class="row"><span class="rank">1</span><div class="chip" style="background:var(--m4)"></div><div class="bar-track"><div class="bar" style="width:100%;background:var(--m4)"></div></div><span class="num">34</span></div>
      <div class="row"><span class="rank">3</span><div class="chip" style="background:var(--m5)"></div><div class="bar-track"><div class="bar" style="width:53%;background:var(--m5)"></div></div><span class="num">18</span></div>
      <div class="row"><span class="rank">4</span><div class="chip" style="background:var(--m2)"></div><div class="bar-track"><div class="bar" style="width:44%;background:var(--m2)"></div></div><span class="num">15</span></div>
      <div class="row"><span class="rank">5</span><div class="chip" style="background:var(--m1)"></div><div class="bar-track"><div class="bar" style="width:35%;background:var(--m1)"></div></div><span class="num">12</span></div>
    </div>
    <p class="foot">113 votes today · wipes at midnight</p>
  </section>

</div>

<script>
  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
    document.getElementById(id).classList.add('show');
    document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('on'));
    document.getElementById('t-'+id).classList.add('on');
  }
</script>
</body>
</html>
