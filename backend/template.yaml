AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Current Mood backend — one Lambda behind a Function URL, backed by a single
  DynamoDB table (one item per NZ day holding that day's five counters).

Parameters:
  AllowOrigin:
    Type: String
    Default: https://tom-henderson.github.io
    Description: >
      Exact origin (scheme+host, no path/trailing slash) allowed by CORS.
      This is the GitHub Pages site the frontend is served from.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 128
    Timeout: 5
    Architectures:
      - arm64

Resources:
  MoodTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # One item per day; PAY_PER_REQUEST suits ultra-low, spiky traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dayKey
          AttributeType: S
      KeySchema:
        - AttributeName: dayKey
          KeyType: HASH
      # No TTL: past days are retained as history (never surfaced).

  # Explicit execution role under /service-role/ (rather than SAM's auto-
  # generated role at path /). The deploy role's IAM permissions and PassRole
  # condition are scoped to arn:aws:iam::*:role/service-role/*, so keeping the
  # function's role on that path lets the deploy create + pass it without any
  # broader IAM grant. Least privilege at runtime: logs (managed) + read/
  # increment on the one table.
  MoodFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: mood-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt MoodTable.Arn

  MoodFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Role: !GetAtt MoodFunctionRole.Arn
      # NOTE: a reserved-concurrency cap (for cost/DoS containment) is intentionally
      # not set. This account's Lambda concurrency limit is ~10, and AWS forces at
      # least 10 to stay unreserved, so any reservation is rejected. The low account
      # limit is itself the de-facto cap for now. To restore an explicit cap, raise
      # the "Concurrent executions" quota (Service Quotas → Lambda) above ~20, then
      # add `ReservedConcurrentExecutions` leaving >=10 unreserved.
      Environment:
        Variables:
          TABLE_NAME: !Ref MoodTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowOrigin
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 300

Outputs:
  FunctionUrl:
    Description: Public Lambda Function URL — set this as the repo variable BACKEND_URL.
    Value: !GetAtt MoodFunctionUrl.FunctionUrl
  TableName:
    Description: DynamoDB table name.
    Value: !Ref MoodTable
